  # --------------------------------------------------------------------------
  # 8. JOBHUB MICROSERVICES (.NET 8) - active definitions for Compose build/manage
  # --------------------------------------------------------------------------
  authservice:
    image: jobhub-authservice:latest
    build:
      context: ./JobHub
      dockerfile: AuthService/Dockerfile
    container_name: jobhub_authservice
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUNNING_IN_DOCKER=true
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=AuthService;Username=postgres;Password=root
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  jobservice:
    image: jobhub-jobservice:latest
    build:
      context: ./JobHub
      dockerfile: JobService/Dockerfile
    container_name: jobhub_jobservice
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUNNING_IN_DOCKER=true
      - ConnectionStrings__JobDb=Host=postgres;Port=5432;Database=JobService;Username=postgres;Password=root
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  companyservice:
    image: jobhub-companyservice:latest
    build:
      context: ./JobHub
      dockerfile: CompanyService/Dockerfile
    container_name: jobhub_companyservice
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUNNING_IN_DOCKER=true
      - ConnectionStrings__CompanyDb=Host=postgres;Port=5432;Database=CompanyService;Username=postgres;Password=root
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - MinIO__Endpoint=minio:9000
      - MinIO__ExternalEndpoint=controlling-bacteria-percentage-franchise.trycloudflare.com
      - MinIO__AccessKey=admin
      - MinIO__SecretKey=AdminPassword123!
      - MinIO__Secure=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  profileservice:
    image: jobhub-profileservice:latest
    build:
      context: ./JobHub
      dockerfile: ProfileService/Dockerfile
    container_name: jobhub_profileservice
    restart: unless-stopped
    profiles: ["app"]
    ports:
