      - RUNNING_IN_DOCKER=true
      - ConnectionStrings__ResumeDb=Host=postgres;Port=5432;Database=ResumeService;Username=postgres;Password=root
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - MinIO__Endpoint=minio:9000
      - MinIO__ExternalEndpoint=controlling-bacteria-percentage-franchise.trycloudflare.com
      - MinIO__AccessKey=admin
      - MinIO__SecretKey=AdminPassword123!
      - MinIO__Secure=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notificationservice:
    image: jobhub-notificationservice:latest
    build:
      context: ./JobHub
      dockerfile: NotificationService/Dockerfile
    container_name: jobhub_notificationservice
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUNNING_IN_DOCKER=true
      - ConnectionStrings__NotificationDb=Host=postgres;Port=5432;Database=NotificationService;Username=postgres;Password=root
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  apigateway:
    image: jobhub-apigateway:latest
    build:
      context: ./JobHub
      dockerfile: ApiGateway/Dockerfile
    container_name: jobhub_apigateway
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUNNING_IN_DOCKER=true
    depends_on:
      - authservice
      - jobservice
      - companyservice
      - profileservice
      - resumeservice
      - notificationservice
      - cvintelligenceservice
      - dataanalyticsservice

  # --------------------------------------------------------------------------
  # 9. JOBHUB AI MICROSERVICES (FastAPI)
  # --------------------------------------------------------------------------
  cvintelligenceservice:
    image: jobhub-cvintelligenceservice:latest
    build:
      context: ./JobHub/CVIntelligenceService
      dockerfile: Dockerfile
    container_name: jobhub_cvintelligence
    restart: unless-stopped
    ports:
      - "5006:5006"
    env_file:
      - ./JobHub/CVIntelligenceService/.env
    environment:
      - MONGO_URL=mongodb://root:root@mongodb:27017/?authSource=admin
      - MONGO_DB=CVIntelligenceDB
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./JobHub/CVIntelligenceService/gemini-keys.json:/app/gemini-keys.json
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  dataanalyticsservice:
    image: jobhub-dataanalyticsservice:latest
    build:
      context: ./JobHub/DataAnalyticsService
      dockerfile: Dockerfile
    container_name: jobhub_dataanalytics
    restart: unless-stopped
    ports:
      - "5007:5007"
    env_file:
      - ./JobHub/DataAnalyticsService/.env
    environment:
      - MONGO_URL=mongodb://root:root@mongodb:27017/?authSource=admin
      - MONGO_DB=DataAnalyticsDB
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODEL_PATH=app/ml/artifacts/salary_model.pkl
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# Đăng ký các ổ cứng ảo (lưu data cục bộ, không mất khi tắt container)
volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  mongodb_data:
  elasticsearch_data:
